name: Gerar EditorDePDF.exe
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: EditorDePDF
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - run: python -m unittest discover -s tests -v
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name EditorDePDF --collect-all pypdfium2 --collect-all pypdfium2_raw --collect-all pikepdf main.py
      - name: Autoteste do exe
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath "dist\EditorDePDF.exe" -ArgumentList "--autoteste" -Wait -PassThru
          if (Test-Path "$env:TEMP\EditorDePDF_autoteste.log") { Get-Content "$env:TEMP\EditorDePDF_autoteste.log" }
          if ($p.ExitCode -ne 0) { throw "Autoteste falhou" }
      - uses: actions/upload-artifact@v4
        with:
          name: EditorDePDF-windows
          path: EditorDePDF/dist/EditorDePDF.exe
